<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Mi CV</title>
</head>
<body>

  <header>
    <h1>Contacto</h1>
    <p>¿Tienes alguna duda o propuesta? Escríbeme y te responderé lo antes posible.</p>
    <p>Los campos marcados con <abbr title="obligatorio">*</abbr> son obligatorios.</p>
  </header>

  <main>
    <form action="#" method="post">

      <fieldset>
        <legend>Datos personales</legend>

        <p>
          <label for="nombre">Nombre <abbr title="obligatorio">*</abbr></label><br>
          <input type="text" id="nombre" name="nombre" autocomplete="name" maxlength="100" required>
        </p>

        <p>
          <label for="email">Email <abbr title="obligatorio">*</abbr></label><br>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="nombre@ejemplo.com" required>
        </p>

        <p>
          <label for="telefono">Teléfono (opcional)</label><br>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="600 123 456" pattern="[0-9+ ]{9,15}" title="Entre 9 y 15 dígitos; puedes usar espacios y el prefijo +">
        </p>

        <p>
          <label for="nacimiento">Fecha de nacimiento <abbr title="obligatorio">*</abbr></label><br>
          <input type="date" id="nacimiento" name="nacimiento" autocomplete="bday" min="1900-01-01" required>
        </p>
      </fieldset>

      <fieldset>
        <legend>Turno preferido para contactarte <abbr title="obligatorio">*</abbr></legend>

        <input type="radio" id="turno-manana" name="turno" value="manana" required>
        <label for="turno-manana">Mañana</label><br>

        <input type="radio" id="turno-tarde" name="turno" value="tarde">
        <label for="turno-tarde">Tarde</label>
      </fieldset>

      <fieldset>
        <legend>Tu consulta</legend>

        <p>
          <label for="mensaje">Mensaje <abbr title="obligatorio">*</abbr></label><br>
          <textarea id="mensaje" name="mensaje" rows="6" cols="50" maxlength="1000" placeholder="Cuéntame tu duda…" required></textarea>
        </p>

        <p>
          <input type="checkbox" id="newsletter" name="newsletter" value="si">
          <label for="newsletter">Quiero recibir la newsletter</label>
        </p>
      </fieldset>

      <p>
        <button type="submit">Enviar mensaje</button>
        <button type="reset">Borrar formulario</button>
      </p>

    </form>
  </main>

</body>
</html>
